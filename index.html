<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#6b0a0a">
  <title>Restaurant Alicia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mulish:ital,wght@0,400;0,600;0,700;1,400&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <header class="cab">
      <h1 id="nombre">Restaurant Alicia</h1>
      <p id="subtitulo">Comida Criolla</p>
    </header>

    <div class="tabs" role="tablist" aria-label="Tipo de carta">
      <button class="tab activa" id="tab-dia" role="tab" aria-selected="true" data-vista="dia" type="button">Menú del día</button>
      <button class="tab" id="tab-carta" role="tab" aria-selected="false" data-vista="carta" type="button">A la carta</button>
    </div>

    <section id="vista" class="vista" aria-live="polite">
      <p class="aviso">Cargando carta…</p>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
